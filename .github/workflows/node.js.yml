# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI Frontend Configuration for Pingly

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    # the strategy and matrix that included three node version check has been removed from the initial yml file
    # this prevent the build being slow 

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.12.0 #instead of martix I added the specific node version based on my project dependencies
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm test -- --watch=false||true
